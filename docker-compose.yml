services:
  app1:
    build:
      context: ./backend
    container_name: smart-home-app1
    environment:
      PORT: 3000
      JWT_SECRET: dev-secret-change-in-prod
      INSTANCE_NAME: app1
    expose:
      - "3000"

  app2:
    build:
      context: ./backend
    container_name: smart-home-app2
    environment:
      PORT: 3000
      JWT_SECRET: dev-secret-change-in-prod
      INSTANCE_NAME: app2
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    container_name: smart-home-nginx
    depends_on:
      - app1
      - app2
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
