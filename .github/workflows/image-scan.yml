name: Container Image Scan

on:
  push:
    branches:
      - devsecops
      - main
  pull_request:

jobs:
  trivy-scan:
    name: Build and scan Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t smart-home-backend:latest ./backend

      - name: Run Trivy scan (JSON report for artifact)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}:/workspace \
            aquasec/trivy:0.58.2 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile /workspace/.trivyignore \
            --format json \
            --output /workspace/trivy-report.json \
            smart-home-backend:latest
        continue-on-error: true

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-report.json

      - name: Fail if HIGH or CRITICAL unfixed vulnerabilities exist
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}:/workspace \
            aquasec/trivy:0.58.2 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --ignorefile /workspace/.trivyignore \
            --exit-code 1 \
            smart-home-backend:latest
